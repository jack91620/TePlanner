# Tautomation Android — Gradle properties
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Compose
android.defaults.buildfeatures.buildconfig=true

# Suppress deprecation warning during Phase F bring-up
android.nonTransitiveRClass=true

# F.0 — silence "compileSdk=36 not supported by AGP 8.7" warning;
# the compile is fine, AGP just hadn't been validated against API 36
# at release time.
android.suppressUnsupportedCompileSdk=36

# F.0 — disable AGP's SDK auto-installer. Build-tools 34.0.0 is
# already on disk; the auto-installer was hanging on a phantom
# re-download attempt of the same package. Manual install via
# sdkmanager if anything's actually missing.
android.builder.sdkDownload=false

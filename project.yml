name: TePlannerApp

options:
  bundleIdPrefix: com.teplanner
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  groupSortPosition: top
  generateEmptyDirectories: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  TePlannerKit:
    path: .

targets:
  TePlannerApp:
    type: application
    platform: iOS
    sources:
      - path: TePlannerApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: TePlannerApp
        INFOPLIST_FILE: TePlannerApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CURRENT_PROJECT_VERSION is set in Config.xcconfig so
        # `make next-build` can bump it without regenerating the
        # xcodeproj. MARKETING_VERSION (user-facing) stays here.
        MARKETING_VERSION: 1.0.0
    dependencies:
      - package: TePlannerKit
        product: TePlannerKit

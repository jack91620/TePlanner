# Search → tap result → route preview sheet renders.
#
# Assumes app already launched + logged in (run after 01_login.yaml,
# or against an app with cached AuthSession). Use `runFlow:` to chain.

appId: com.teplanner.ios
---
- launchApp

# If we landed on splash (no session), bail with a clear hint —
# this flow expects the user to be logged in.
- runFlow:
    when:
      visible:
        id: "login_button"
    commands:
      - assertVisible: "RUN_01_LOGIN_FIRST"

- tapOn:
    id: "home_search_button"

- assertVisible:
    id: "search_field"
- tapOn:
    id: "search_field"
- inputText: "gugong"

# Debounce is 300ms; results land within ~1s on a typical AMap response.
- extendedWaitUntil:
    visible:
      id: "search_result_0"
    timeout: 8000

- tapOn:
    id: "search_result_0"

# Route preview sheet header.
- extendedWaitUntil:
    visible: "路线预览"
    timeout: 30000

# Plan summary should populate within ~10s of the backend roundtrip.
- extendedWaitUntil:
    visible: "总距离"
    timeout: 30000
- assertVisible:
    id: "send_to_vehicle_button"
- takeScreenshot: tmp/screenshots/maestro_route_preview

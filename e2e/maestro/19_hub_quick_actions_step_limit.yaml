# Step limit — editor allows 1..5 steps. "添加步骤" button must
# disappear after 5 are added. Catches a "user creates 10-step
# macro by mistake, can't undo" UX regression.
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- scrollUntilVisible:
    element:
      id: "hub_quick_action_empty_4"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_quick_action_empty_4"
- extendedWaitUntil:
    visible:
      id: "hub_action_picker_create"
    timeout: 5000
- tapOn:
    id: "hub_action_picker_create"
- extendedWaitUntil:
    visible:
      id: "hub_action_editor_name"
    timeout: 5000

# Editor starts with 1 empty step. Add 4 more (each just gets a
# capability picked) to reach 5.
- tapOn:
    id: "hub_action_editor_name"
- inputText: "上限"

# Pick a cap for step 0.
- tapOn:
    id: "hub_action_editor_capability_0"
- extendedWaitUntil:
    visible: "关闭空调"
    timeout: 5000
- tapOn:
    text: "关闭空调"

# Add steps 1..4 (4 more, total = 5).
- scrollUntilVisible:
    element:
      id: "hub_action_editor_add_step"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_action_editor_add_step"
- scrollUntilVisible:
    element:
      id: "hub_action_editor_add_step"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_action_editor_add_step"
- scrollUntilVisible:
    element:
      id: "hub_action_editor_add_step"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_action_editor_add_step"
- scrollUntilVisible:
    element:
      id: "hub_action_editor_add_step"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_action_editor_add_step"

# Now 5 steps. The button must be gone.
- assertNotVisible:
    id: "hub_action_editor_add_step"

- takeScreenshot: tmp/screenshots/hub_quick_actions_step_limit

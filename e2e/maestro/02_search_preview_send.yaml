# Search → result tap → route preview → polyline on map → send.
# Single flow because Maestro relaunches the app between files; the
# preview sheet doesn't survive a fresh launch.

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- tapOn:
    id: "home_search_button"

- assertVisible:
    id: "search_field"
- tapOn:
    id: "search_field"
- inputText: "gugong"

# Debounce + AMap roundtrip.
- extendedWaitUntil:
    visible:
      id: "search_result_0"
    timeout: 8000

- tapOn:
    id: "search_result_0"

# Route-preview sheet header + summary populate within ~30s
# (depends on backend's plan_route → Tencent route + alongby chain).
- extendedWaitUntil:
    visible: "路线预览"
    timeout: 30000
- extendedWaitUntil:
    visible: "总距离"
    timeout: 30000
- assertVisible:
    id: "send_to_vehicle_button"
- takeScreenshot: tmp/screenshots/maestro_route_preview

# Send-to-vehicle: button transitions through .sending → terminal
# state (.sent or .failed). We just verify the request fired by
# waiting for either label.
- tapOn:
    id: "send_to_vehicle_button"
- extendedWaitUntil:
    visible: "已发送|重新发送"
    timeout: 30000
- takeScreenshot: tmp/screenshots/maestro_after_send

# Close the sheet → HomeView reappears with the polyline + charging-
# stop pins drawn on the AMap (the host kept currentRoute via
# RoutePreviewViewModel.onPlanLoaded).
- tapOn: "关闭"
- assertVisible: "TePlanner"
- takeScreenshot: tmp/screenshots/maestro_map_with_route

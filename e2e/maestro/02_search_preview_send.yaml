# Search → result tap → drawer flips to 当前路线 → polyline on map → send.
# The drawer is the single source of truth for the route — there's no
# longer a modal preview sheet. Single flow because Maestro relaunches
# the app between files.

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml
- runFlow: _helpers/enter_planning.yaml

- tapOn:
    id: "home_search_button"

- assertVisible:
    id: "search_field"
- tapOn:
    id: "search_field"
- inputText: "gugong"

# Debounce + AMap roundtrip.
- extendedWaitUntil:
    visible:
      id: "search_result_0"
    timeout: 8000

- tapOn:
    id: "search_result_0"

# Drawer should flip to 当前路线 once the 3-step plan resolves
# (route + alongby + charging-plan). Header + summary appear together.
- extendedWaitUntil:
    visible: "当前路线"
    timeout: 30000
- extendedWaitUntil:
    visible: "总距离"
    timeout: 30000
- assertVisible:
    id: "send_to_vehicle_button"
- takeScreenshot: tmp/screenshots/maestro_route_summary

# Send-to-vehicle: button transitions through .sending → terminal
# state (.sent or .failed). We just verify the request fired by
# waiting for either label.
- tapOn:
    id: "send_to_vehicle_button"
- extendedWaitUntil:
    visible: "已发送|重新发送"
    timeout: 30000
- takeScreenshot: tmp/screenshots/maestro_after_send

# Drawer stays put with the route summary; map behind it shows polyline
# + charging-stop pins.
- assertVisible: "充电规划"
- takeScreenshot: tmp/screenshots/maestro_map_with_route

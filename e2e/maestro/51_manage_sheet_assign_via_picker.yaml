# Manage sheet → tap empty slot → picker opens → pick existing
# action → slot fills. Different from Hub's empty-slot tap (flow
# 22) because the manage sheet's picker invocation goes through
# the new HubActionsManageSheet, which re-mounts
# HubActionSlotPickerSheet but with its own wiring. Catches a
# regression where the manage sheet's slot-picker callback fails
# to bind the assignment back to the store.
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

# 1. Open manage sheet.
- scrollUntilVisible:
    element:
      id: "hub_quick_actions_manage"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_quick_actions_manage"
- extendedWaitUntil:
    visible: "管理快捷操作"
    timeout: 5000

# 2. Clear slot 0 first so we have a known empty slot to assign
# into. Without this, all top-row slots are filled by system
# defaults and tapping a × would interfere with the verification.
- tapOn:
    id: "hub_manage_clear_x_0"
- extendedWaitUntil:
    visible:
      id: "hub_manage_slot_empty_0"
    timeout: 5000

# 3. Tap the empty slot → picker sheet opens.
- tapOn:
    id: "hub_manage_slot_empty_0"
- extendedWaitUntil:
    visible: "选择动作"
    timeout: 5000

# 4. Pick 解锁 (the action displaced from slot 1 — still in the
# library, currently in slot 1, but assigning to slot 0 should
# move it from 1 → 0). NOTE: 锁车 is in the library under "未分配"
# now since we cleared slot 0. Picking 锁车 → slot 0 should re-
# fill that slot with the same action.
- extendedWaitUntil:
    visible: "锁车"
    timeout: 5000
- tapOn:
    text: "锁车"

# 5. Picker dismisses, manage sheet shows slot 0 filled again.
- extendedWaitUntil:
    visible:
      id: "hub_manage_slot_0"
    timeout: 5000

- takeScreenshot: tmp/screenshots/manage_sheet_reassigned

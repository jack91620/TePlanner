# Editor save button must be disabled until the form is valid:
#   - Name field non-empty after trim
#   - At least one step has a capability picked
# Tapping "保存" while it's disabled does nothing.
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- scrollUntilVisible:
    element:
      id: "hub_quick_action_empty_4"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_quick_action_empty_4"
- extendedWaitUntil:
    visible:
      id: "hub_action_picker_create"
    timeout: 5000
- tapOn:
    id: "hub_action_picker_create"
- extendedWaitUntil:
    visible:
      id: "hub_action_editor_name"
    timeout: 5000

# Editor starts with empty name + empty capability step. Save must
# fail/no-op. Tap it and verify the editor is STILL open after.
- tapOn:
    id: "hub_action_editor_save"
- assertVisible:
    id: "hub_action_editor_name"

# Fill name but leave capability empty. Still invalid.
- tapOn:
    id: "hub_action_editor_name"
- inputText: "测验"
- tapOn:
    id: "hub_action_editor_save"
- assertVisible:
    id: "hub_action_editor_name"

# Now also pick a capability. Save should succeed.
- tapOn:
    id: "hub_action_editor_capability_0"
- extendedWaitUntil:
    visible: "关闭空调"
    timeout: 5000
- tapOn:
    text: "关闭空调"
- tapOn:
    id: "hub_action_editor_save"

# Editor dismissed, action in slot 4.
- assertNotVisible:
    id: "hub_action_editor_name"
- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_4"
    direction: DOWN
    timeout: 5000
- assertVisible: "测验"

- takeScreenshot: tmp/screenshots/hub_quick_actions_validation_pass

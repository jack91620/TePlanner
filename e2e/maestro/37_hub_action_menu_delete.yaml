# Long-press → "删除动作" path. Only non-system actions show this
# option (system actions like 锁车/解锁 are defended in the UI).
# Pre-step: create a custom action via the "新建" button. Then
# long-press the new tile, tap 删除, confirm.
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_0"
    direction: DOWN
    timeout: 5000

# Create a custom action so the delete option is visible.
- tapOn:
    id: "hub_quick_actions_manage"
- extendedWaitUntil:
    visible:
      id: "hub_action_editor_name"
    timeout: 5000
- tapOn:
    id: "hub_action_editor_name"
- inputText: "测试删除"
- tapOn:
    id: "hub_action_editor_capability_0"
- extendedWaitUntil:
    visible: "关闭空调"
    timeout: 5000
- tapOn:
    text: "关闭空调"
- tapOn:
    id: "hub_action_editor_save"

# Action auto-assigned to first empty slot — slot 4 in the seeded
# layout. Scroll to it.
- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_4"
    direction: DOWN
    timeout: 5000

# System actions hide 删除动作; verify the long-press menu offers
# it for the custom one we just made.
- longPressOn:
    id: "hub_quick_action_slot_4"
- extendedWaitUntil:
    visible:
      id: "hub_action_menu_delete"
    timeout: 5000
- tapOn:
    id: "hub_action_menu_delete"

# Confirm alert pops; tap 删除.
- extendedWaitUntil:
    visible:
      id: "hub_action_delete_confirm"
    timeout: 5000
- tapOn:
    id: "hub_action_delete_confirm"

# Slot 4 is now empty (action removed from library + slot cleared).
- extendedWaitUntil:
    visible:
      id: "hub_quick_action_empty_4"
    timeout: 5000

- takeScreenshot: tmp/screenshots/hub_action_menu_delete

# Cross-platform: open manage sheet → tap × badge on slot 0 →
# slot becomes empty (action stays in library).

appId: com.placeholder.shared
---
- scrollUntilVisible:
    element:
      id: "hub_quick_actions_manage"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_quick_actions_manage"

- extendedWaitUntil:
    visible: "管理快捷操作"
    timeout: 5000

# Slot 0 is the filled 锁车 (system seeded). Tap its × badge.
- assertVisible:
    id: "hub_manage_slot_0"
- tapOn:
    id: "hub_manage_clear_x_0"

- extendedWaitUntil:
    visible:
      id: "hub_manage_slot_empty_0"
    timeout: 5000

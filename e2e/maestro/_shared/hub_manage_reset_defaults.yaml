# Cross-platform: open manage sheet → 重置为默认 → AlertDialog →
# 重置 → AlertDialog dismisses (state is wiped back to the 4
# seeded system actions).

appId: com.placeholder.shared
---
- scrollUntilVisible:
    element:
      id: "hub_quick_actions_manage"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_quick_actions_manage"

- extendedWaitUntil:
    visible: "管理快捷操作"
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "hub_manage_reset_button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_manage_reset_button"

# Destructive confirm dialog. AlertDialog renders in its own
# Dialog window without the testTagsAsResourceId opt-in, so the
# `hub_manage_reset_confirm` testTag isn't queryable. Match the
# exact "重置" button label — works on both platforms.
- extendedWaitUntil:
    visible: "重置为默认？"
    timeout: 5000
- tapOn: "^重置$"

# Dialog dismisses. Slot 0 should still be filled (system_lock
# was reseeded). Scroll back up to verify.
- extendedWaitUntil:
    notVisible: "重置为默认？"
    timeout: 5000

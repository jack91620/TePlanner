# Cross-platform smoke: Hub renders status card + 3 navigation entries.
#
# Identifier contract (same string both platforms):
#   hub_status_card        — top vehicle card (battery + range)
#   hub_entry_planning     — 充电规划 nav card
#   hub_entry_automations  — 自动化提醒 nav card
#   hub_entry_battery      — 电池管理 nav card
#
# Precondition: app launched + already at the Hub.

# Maestro 1.38+ requires every flow file to declare an appId.
# Wrapper files override at launchApp time; this is a placeholder.
appId: com.placeholder.shared
---
- extendedWaitUntil:
    visible:
      id: "hub_status_card"
    timeout: 8000

# Hub grew taller as AlertPill / welcome banner / chips landed; small
# emulator viewports clip the deeper entries. Scroll down to each so
# the assertion passes regardless of screen size.
- scrollUntilVisible:
    element:
      id: "hub_entry_planning"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "hub_entry_automations"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "hub_entry_battery"
    direction: DOWN
    timeout: 5000

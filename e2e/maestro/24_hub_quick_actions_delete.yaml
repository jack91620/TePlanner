# Delete a custom action — verify the slot it occupied becomes
# empty and the action is gone from the pool.
#
# Slot 4 must start empty. The reset helper wipes the library and
# re-seeds the 4 system defaults into slots 0-3, leaving slot 4
# empty regardless of prior test residue.
appId: com.teplanner.ios
---
- runFlow: _helpers/reset_hub_library.yaml

- scrollUntilVisible:
    element:
      id: "hub_quick_action_empty_4"
    direction: DOWN
    timeout: 5000

# Create a temp action in slot 4.
- tapOn:
    id: "hub_quick_action_empty_4"
- extendedWaitUntil:
    visible:
      id: "hub_action_picker_create"
    timeout: 5000
- tapOn:
    id: "hub_action_picker_create"
- extendedWaitUntil:
    visible:
      id: "hub_action_editor_name"
    timeout: 5000
- tapOn:
    id: "hub_action_editor_name"
- inputText: "待删"
- tapOn:
    id: "hub_action_editor_capability_0"
- extendedWaitUntil:
    visible: "关闭空调"
    timeout: 5000
- tapOn:
    text: "关闭空调"
- tapOn:
    id: "hub_action_editor_save"
- extendedWaitUntil:
    visible: "待删"
    timeout: 5000

# Long-press the new tile to open the context menu. Phase 1 added
# this so long-press surfaces 编辑动作 / 分享 / 从槽位移除 / 删除动作
# instead of going straight to the editor.
- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_4"
    direction: DOWN
    timeout: 5000
- longPressOn:
    id: "hub_quick_action_slot_4"
- extendedWaitUntil:
    visible:
      id: "hub_action_menu_delete"
    timeout: 5000

# Delete + confirm.
- tapOn:
    id: "hub_action_menu_delete"
- extendedWaitUntil:
    visible: "删除"
    timeout: 5000
- tapOn:
    text: "删除"

# Slot 4 is now empty again — the dashed "+" tile reappears.
- scrollUntilVisible:
    element:
      id: "hub_quick_action_empty_4"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "hub_quick_action_empty_4"
- assertNotVisible: "待删"

- takeScreenshot: tmp/screenshots/hub_quick_actions_after_delete

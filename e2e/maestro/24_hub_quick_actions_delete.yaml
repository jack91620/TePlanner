# Delete a custom action — verify the slot it occupied becomes
# empty and the action is gone from the pool.
#
# Assumes a clean state (reset_hub_actions.sh) so slot 4 starts
# empty. Creates a throwaway custom action there, then deletes it.
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- scrollUntilVisible:
    element:
      id: "hub_quick_action_empty_4"
    direction: DOWN
    timeout: 5000

# Create a temp action in slot 4.
- tapOn:
    id: "hub_quick_action_empty_4"
- extendedWaitUntil:
    visible:
      id: "hub_action_picker_create"
    timeout: 5000
- tapOn:
    id: "hub_action_picker_create"
- extendedWaitUntil:
    visible:
      id: "hub_action_editor_name"
    timeout: 5000
- tapOn:
    id: "hub_action_editor_name"
- inputText: "待删"
- tapOn:
    id: "hub_action_editor_capability_0"
- extendedWaitUntil:
    visible: "关闭空调"
    timeout: 5000
- tapOn:
    text: "关闭空调"
- tapOn:
    id: "hub_action_editor_save"
- extendedWaitUntil:
    visible: "待删"
    timeout: 5000

# Long-press the new tile to reopen the editor with delete enabled.
# slot 4 is below viewport on iPhone 17 once the keyboard closes;
# scroll back into view before the gesture.
- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_4"
    direction: DOWN
    timeout: 5000
- longPressOn:
    id: "hub_quick_action_slot_4"
- extendedWaitUntil:
    visible:
      id: "hub_action_editor_delete"
    timeout: 5000

# Delete + confirm.
- tapOn:
    id: "hub_action_editor_delete"
- extendedWaitUntil:
    visible: "删除"
    timeout: 5000
- tapOn:
    text: "删除"

# Slot 4 is now empty again — the dashed "+" tile reappears.
- scrollUntilVisible:
    element:
      id: "hub_quick_action_empty_4"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "hub_quick_action_empty_4"
- assertNotVisible: "待删"

- takeScreenshot: tmp/screenshots/hub_quick_actions_after_delete

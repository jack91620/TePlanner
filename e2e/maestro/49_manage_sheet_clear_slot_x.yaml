# Manage sheet → tap × badge on a filled slot tile → slot becomes
# empty, action stays in the library. Different from the Hub
# long-press 从槽位移除 (flow 36) — this is the dedicated, less-
# hidden, "edit mode" entry point that doesn't require knowing
# to long-press.
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- scrollUntilVisible:
    element:
      id: "hub_quick_actions_manage"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_quick_actions_manage"

- extendedWaitUntil:
    visible: "管理快捷操作"
    timeout: 5000

# Slot 0 is the filled 锁车 tile. Tap its × badge to clear.
# The badge sits at the top-trailing corner of the tile and shares
# `hub_manage_clear_x` identifier (since multiple tiles render
# their own × — Maestro disambiguates by finding the one inside
# slot 0).
- assertVisible:
    id: "hub_manage_slot_0"

- tapOn:
    id: "hub_manage_clear_x_0"

# Slot 0 became empty; the action is still in the library list.
- extendedWaitUntil:
    visible:
      id: "hub_manage_slot_empty_0"
    timeout: 5000
- assertVisible: "锁车"

- takeScreenshot: tmp/screenshots/manage_sheet_after_clear

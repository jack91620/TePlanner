# Phase 5 自动化提醒 — 进入设置 → 自动化提醒列表 → 调整阈值 → 保存
# 验证：列表里 3 条规则都能看到 toggle，调整后保存能回到主页。

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- tapOn:
    id: "home_menu_button"
- extendedWaitUntil:
    visible: "设置"
    timeout: 5000
- tapOn: "设置"

- extendedWaitUntil:
    visible: "自动化提醒"
    timeout: 5000
- tapOn:
    id: "automations_link"

- extendedWaitUntil:
    visible: "露营模式超时提醒"
    timeout: 5000
- assertVisible: "哨兵模式长时间开启"
- assertVisible: "座舱过热保护"
- takeScreenshot: tmp/screenshots/maestro_automations_list

- tapOn:
    id: "automations_save_button"

- extendedWaitUntil:
    visible: "目标到达电量"
    timeout: 5000
- tapOn: "保存"
- extendedWaitUntil:
    visible:
      id: "home_search_button"
    timeout: 5000

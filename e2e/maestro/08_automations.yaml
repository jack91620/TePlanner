# Phase 10.3.C 自动化主页 — 列表入口、预设可见、能进入详情。
# 前一版的 threshold-slider 滑块 UI 在 Phase 10.3.C 已被
# AutomationsHomeView 替换为列表 + 详情 + 可视化构建器。

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- tapOn:
    id: "hub_entry_automations"

- extendedWaitUntil:
    visible: "露营模式超时提醒"
    timeout: 8000
- assertVisible: "哨兵模式长时间开启"
- assertVisible: "座舱过热保护"
- takeScreenshot: tmp/screenshots/maestro_automations_list

# 充电完成提醒在列表下方——上滑确保它进入视区
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: "充电完成提醒"
    timeout: 5000
- takeScreenshot: tmp/screenshots/maestro_automations_charge_complete

# 进入第一条预设的详情页（点行）
- tapOn: "露营模式超时提醒"
- extendedWaitUntil:
    # Round 5: section header "触发条件" → "当", to match
    # the iOS Shortcuts vocabulary the list view also uses.
    visible: "当"
    timeout: 5000
- assertVisible: "那么"
- takeScreenshot: tmp/screenshots/maestro_automation_detail

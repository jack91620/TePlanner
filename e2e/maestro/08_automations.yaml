# Phase 5 自动化提醒 — Hub 入口 → 自动化列表 → 调阈值 → 保存。
# Phase 6.1 后规则列表是 Hub 的 NavigationLink 而非嵌套在 Settings
# 里，所以直接走 hub_entry_automations 进入。

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- tapOn:
    id: "hub_entry_automations"

- extendedWaitUntil:
    visible: "露营模式超时提醒"
    timeout: 5000
- assertVisible: "哨兵模式长时间开启"
- assertVisible: "座舱过热保护"
- takeScreenshot: tmp/screenshots/maestro_automations_list

# Charge-complete row sits at the bottom of the list — scroll it
# into view before asserting (Phase 5.3 added this row).
- swipe:
    start: 50%, 80%
    end: 50%, 20%
- extendedWaitUntil:
    visible: "充电完成提醒"
    timeout: 5000
- takeScreenshot: tmp/screenshots/maestro_automations_charge_complete

- tapOn:
    id: "automations_save_button"

- extendedWaitUntil:
    visible:
      id: "hub_status_card"
    timeout: 5000

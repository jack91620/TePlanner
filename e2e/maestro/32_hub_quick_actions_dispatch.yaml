# Dispatch a real VCP command from a quick action tile + verify
# the CommandStatusBanner appears and reaches a terminal state.
#
# WARNING: this actually locks the user's real Tesla. 锁车 is the
# safest of the seeded actions (idempotent if already locked; no
# climate side effects; no fuel/quota implications beyond one
# signed VCP command). Tag this flow if your CI shouldn't fire
# it on every run.
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_0"
    direction: DOWN
    timeout: 5000

# Tap 锁车 (confirm_required=false, single-step). Should fire a VCP
# command and pop the status banner.
- tapOn:
    id: "hub_quick_action_slot_0"

# CommandStatusBanner appears within a few seconds. The banner's
# title varies by capability ("正在锁车…" / "正在解锁…" / generic
# "正在执行命令…" for capabilities without a humanName entry).
# Match by the stable "等待车辆确认" detail line which appears on
# every pending status regardless of verb.
- extendedWaitUntil:
    visible: "等待车辆确认"
    timeout: 15000

- takeScreenshot: tmp/screenshots/hub_quick_actions_dispatch_in_flight

# Wait for the banner to dismiss (3s afterglow after terminal state).
# CommandStatusStore.pollUntilSettled polls up to 60s — VCP commands
# on a partially-asleep car can take 30-50s. The test waits a bit
# longer than that ceiling.
- extendedWaitUntil:
    notVisible: "等待车辆确认"
    timeout: 75000

- takeScreenshot: tmp/screenshots/hub_quick_actions_dispatch_settled

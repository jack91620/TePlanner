# 路线规划设置 sheet —— 进入充电规划页 → 菜单 → 路线设置 → 保存。
# 重构后这些设置不再走 Hub 菜单，而是 in-context（在使用它们的
# 充电规划页里就地修改）。

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml
- runFlow: _helpers/enter_planning.yaml

- tapOn:
    id: "map_menu_button"
- extendedWaitUntil:
    visible: "路线设置"
    timeout: 5000
- tapOn: "路线设置"

- extendedWaitUntil:
    visible: "目标到达电量"
    timeout: 5000
- assertVisible: "最低充电电量"
- assertVisible: "优先选择超级充电站"
- assertVisible: "距离单位"
- takeScreenshot: tmp/screenshots/maestro_settings

- tapOn: "保存"
- extendedWaitUntil:
    visible:
      id: "home_search_button"
    timeout: 5000

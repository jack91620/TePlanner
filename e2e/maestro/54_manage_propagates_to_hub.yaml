# Manage sheet clears slot 0 via × → close sheet → Hub's slot 0
# now shows empty placeholder, not the stale "锁车" tile. Verifies
# the parent Hub view re-renders when the store changes from the
# manage sheet (both observe the same @StateObject HubActionsStore,
# but @ObservedObject vs @StateObject propagation can have subtle
# bugs).
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

# Confirm starting state: slot 0 has 锁车.
- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_0"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "hub_quick_action_slot_0"

# Open manage sheet, clear slot 0, close sheet.
- tapOn:
    id: "hub_quick_actions_manage"
- extendedWaitUntil:
    visible: "管理快捷操作"
    timeout: 5000
- tapOn:
    id: "hub_manage_clear_x_0"
- extendedWaitUntil:
    visible:
      id: "hub_manage_slot_empty_0"
    timeout: 5000
- tapOn:
    id: "hub_manage_done_button"

# Back on Hub. Slot 0 must be empty now — Hub re-rendered.
- extendedWaitUntil:
    visible:
      id: "hub_quick_action_empty_0"
    timeout: 5000
- assertNotVisible:
    id: "hub_quick_action_slot_0"

- takeScreenshot: tmp/screenshots/hub_after_manage_clear

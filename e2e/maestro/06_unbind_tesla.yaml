# Unbind Tesla — toolbar menu → 解绑 → confirm dialog → splash.
# This is destructive: it wipes the local session AND revokes the
# server-side Tesla token, so a subsequent OAuth needs full creds.
# Run last in the chain.

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- tapOn:
    id: "hub_menu_button"
- extendedWaitUntil:
    visible: "解绑 Tesla 账户"
    timeout: 5000
- tapOn: "解绑 Tesla 账户"

# Confirmation dialog's destructive button is "确认解绑" — disjoint
# from the menu item's "解绑 Tesla 账户" so Maestro can't race the
# menu's dismiss animation against the dialog's appearance.
- extendedWaitUntil:
    visible: "确认解绑"
    timeout: 8000
- tapOn: "确认解绑"

# Local creds wiped → app routes back to splash.
- extendedWaitUntil:
    visible:
      id: "login_button"
    timeout: 15000
- takeScreenshot: tmp/screenshots/maestro_after_unbind

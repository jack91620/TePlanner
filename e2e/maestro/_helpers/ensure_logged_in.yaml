# Idempotent login guard — used by 02-06 so they can run independently.
# Doesn't wipe state; only fills the OAuth form when the splash is up.
#
# Underscore prefix keeps it out of the alphabetical test runner —
# `maestro test e2e/maestro/` won't execute helpers, only `0*` flows.

appId: com.teplanner.ios
env:
  TESLA_EMAIL: ${MAESTRO_TESLA_EMAIL}
  TESLA_PASSWORD: ${MAESTRO_TESLA_PASSWORD}
---
- launchApp

- runFlow:
    when:
      visible:
        id: "login_button"
    commands:
      - tapOn:
          id: "login_button"
      - runFlow:
          when:
            visible: "电子邮箱地址或登录手机号码"
          commands:
            - tapOn: "电子邮箱地址或登录手机号码"
            - inputText: ${TESLA_EMAIL}
            - pressKey: Enter
            - extendedWaitUntil:
                visible: "密码"
                timeout: 20000
            - tapOn: "密码"
            - inputText: ${TESLA_PASSWORD}
            - pressKey: Enter

# Wait for hub to be rendered. Use the title (always visible on
# hub regardless of overlay alerts) instead of hub_status_card,
# which the Phase 7 配对车辆控制 prompt may overlay right after
# first login.
- extendedWaitUntil:
    visible: "TePlanner"
    timeout: 60000

# Phase 7 (VCP): dismiss the one-time pairing prompt if it pops.
# "稍后再说" always works — defers without disabling anything.
- runFlow:
    when:
      visible: "稍后再说"
    commands:
      - tapOn: "稍后再说"

# Now hub_status_card should be plainly visible.
- extendedWaitUntil:
    visible:
      id: "hub_status_card"
    timeout: 10000

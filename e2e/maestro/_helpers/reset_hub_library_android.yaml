# Android variant of reset_hub_library.yaml — same flow, different
# appId + helper. The shared body inside the manage-sheet path
# matches on testTag IDs that both platforms expose.

appId: com.teplanner.android
---
- runFlow: ensure_logged_in_android.yaml

- scrollUntilVisible:
    element:
      id: "hub_quick_actions_manage"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_quick_actions_manage"

- extendedWaitUntil:
    visible: "管理快捷操作"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "hub_manage_reset_button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_manage_reset_button"

# Android AlertDialog confirm button — testTagsAsResourceId opt-in
# doesn't reach Dialog content, so match button text.
- extendedWaitUntil:
    visible: "重置为默认？"
    timeout: 5000
- tapOn: "^重置$"

- extendedWaitUntil:
    notVisible: "重置为默认？"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000

# Dismiss manage sheet via the back gesture (Maestro `back` on
# Android pops the bottom sheet without going to the previous screen).
- back
- extendedWaitUntil:
    notVisible: "管理快捷操作"
    timeout: 5000

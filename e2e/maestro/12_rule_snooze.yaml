# 12. 规则静音 — 右滑 → 静音按钮 → 时长 dialog → 选择 → 橙色徽章
#
# UI evolved: long-press used to open a context menu with snooze
# options. That was replaced by `.swipeActions(edge: .leading)` —
# right-swipe a rule to reveal a single 静音 button which opens a
# confirmationDialog with the duration choices. Long-press is
# reserved for native drag-to-reorder.
#
# Phase D.1 — server-canonical snoozes: this flow exercises the
# POST /automations/{id}/snooze + DELETE round-trip via the new
# UI. Idempotency: "全部恢复" tap clears any leftover snoozes
# from a previous run before we start.

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- tapOn:
    id: "hub_entry_automations"

- extendedWaitUntil:
    visible: "露营模式超时提醒"
    timeout: 8000

# Idempotency reset.
- runFlow:
    when:
      visible: "全部恢复"
    commands:
      - tapOn: "全部恢复"
      - extendedWaitUntil:
          notVisible: "全部恢复"
          timeout: 5000

# Right-swipe (leading) reveals the 静音 swipe button.
- swipe:
    from: "露营模式超时提醒"
    direction: RIGHT
- extendedWaitUntil:
    visible: "静音"
    timeout: 3000
- tapOn: "静音"

# confirmationDialog with duration choices appears.
- extendedWaitUntil:
    visible: "静音 1 小时"
    timeout: 3000
- tapOn: "静音 1 小时"

# Snooze took effect: top-of-list banner mentions the snooze count.
# Note: the per-row "已静音至 13:26" badge is rendered (see
# screenshot) but Maestro's substring matcher doesn't reliably
# find it in iOS 26.4 — the Label puts icon + text in one
# accessibility element. The top banner is a clean substring match
# and proves the same thing (snooze persisted server-side + the
# list re-rendered).
- extendedWaitUntil:
    visible:
      id: "automations_snooze_banner"
    timeout: 8000
- takeScreenshot: tmp/screenshots/maestro_rule_snoozed

# Unsnooze via the same swipe — when a rule is snoozed, the
# swipe button label flips to 取消静音 and acts immediately.
- swipe:
    from: "露营模式超时提醒"
    direction: RIGHT
- extendedWaitUntil:
    visible: "取消静音"
    timeout: 3000
- tapOn: "取消静音"

# Banner disappears.
- extendedWaitUntil:
    notVisible:
      id: "automations_snooze_banner"
    timeout: 5000
- takeScreenshot: tmp/screenshots/maestro_rule_unsnoozed

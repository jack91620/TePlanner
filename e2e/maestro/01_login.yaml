# End-to-end Tesla OAuth login.
#
# Drives the splash → WKWebView → HomeView chain. Reads credentials
# from environment so secrets stay out of git:
#   MAESTRO_TESLA_EMAIL=...    MAESTRO_TESLA_PASSWORD=...
#   maestro test e2e/maestro/01_login.yaml
#
# Or via .env file: `make e2e-ios` (Makefile sources e2e/maestro/.env).

appId: com.teplanner.ios
env:
  TESLA_EMAIL: ${MAESTRO_TESLA_EMAIL}
  TESLA_PASSWORD: ${MAESTRO_TESLA_PASSWORD}
---
- launchApp:
    clearState: true
    clearKeychain: true

- assertVisible: "TePlanner"
- assertVisible:
    id: "login_button"

- tapOn:
    id: "login_button"

# Tesla cookies may still be cached in WKWebView's WKWebsiteDataStore
# (clearKeychain doesn't touch them), so the auth page can fly past
# without us needing to type. Only fill the form when it's actually
# visible. Either way, the next assert is HomeView.
- runFlow:
    when:
      visible: "电子邮箱地址或登录手机号码"
    commands:
      - tapOn: "电子邮箱地址或登录手机号码"
      - inputText: ${TESLA_EMAIL}
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "密码"
          timeout: 20000
      - tapOn: "密码"
      - inputText: ${TESLA_PASSWORD}
      - pressKey: Enter

# After OAuth completes, RootView swaps to HubView whose status card
# is the unique landing element. Long timeout because Tesla → backend
# → JS scrape → AuthSession.login() can take 10–20s on a cold start.
- extendedWaitUntil:
    visible:
      id: "hub_status_card"
    timeout: 60000

- assertVisible: "TePlanner"
- assertVisible:
    id: "hub_entry_planning"
- assertVisible:
    id: "hub_entry_automations"
- takeScreenshot: tmp/screenshots/maestro_after_login

# "管理" button is the alternate entry to the action editor — for
# users who want to author actions without first picking a slot.
# Verifies the create-from-manage path is wired (the in-app
# entrypoint isn't otherwise covered).
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

# Scroll the section into view first. The "管理" button sits on the
# section header row but Maestro's scrollUntilVisible sometimes
# undershoots when the target is small/at-edge; scrolling to a
# tile inside the section reliably gets us to the same screen.
- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_0"
    direction: DOWN
    timeout: 5000

- extendedWaitUntil:
    visible:
      id: "hub_quick_actions_manage"
    timeout: 5000
- tapOn:
    id: "hub_quick_actions_manage"
- extendedWaitUntil:
    visible:
      id: "hub_action_editor_name"
    timeout: 5000

- tapOn:
    id: "hub_action_editor_name"
- inputText: "管理键"
- tapOn:
    id: "hub_action_editor_capability_0"
- extendedWaitUntil:
    visible: "关闭空调"
    timeout: 5000
- tapOn:
    text: "关闭空调"
- tapOn:
    id: "hub_action_editor_save"

# Action auto-assigned to first empty slot — slot 4 (off-viewport
# on iPhone 17 once the keyboard closes). Scroll back to it.
- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_4"
    direction: DOWN
    timeout: 5000
- assertVisible: "管理键"

- takeScreenshot: tmp/screenshots/hub_quick_actions_manage_save

# Phase 5.6 智能充电限额卡片 —— 主页 → 点击"建议..."卡片 → 应用到车辆。
# 卡片是条件显示的：仅当车辆当前 charge_limit_soc 与用户预设不一致才出现。
# 跳过场景：if card not visible，写 placeholder screenshot 让我们知道测试被跳过。

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- runFlow:
    when:
      visible:
        id: "hub_charge_limit_card"
    commands:
      - takeScreenshot: tmp/screenshots/maestro_charge_limit_before
      # Round 12+: card itself is no longer a button — the explicit
      # "应用" capsule on the right is. Tap that.
      - tapOn:
          id: "hub_charge_limit_apply"
      # 期望：点击后按钮短暂转 ProgressView，然后变 "已应用" 对勾，
      # 或最终回到 idle。不期望弹出 "操作失败" alert。
      - extendedWaitUntil:
          notVisible: "操作失败"
          timeout: 5000
      - takeScreenshot: tmp/screenshots/maestro_charge_limit_after

- runFlow:
    when:
      notVisible:
        id: "hub_charge_limit_card"
    commands:
      - takeScreenshot: tmp/screenshots/maestro_charge_limit_skipped

# "管理" button on the Hub quick actions section header opens the
# manage sheet. Inside the sheet, tapping "新建动作" reaches the
# editor; saving lands the new action in the library + (if a slot
# is free) auto-assigns it.
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_0"
    direction: DOWN
    timeout: 5000

- extendedWaitUntil:
    visible:
      id: "hub_quick_actions_manage"
    timeout: 5000
- tapOn:
    id: "hub_quick_actions_manage"

# Manage sheet opens.
- extendedWaitUntil:
    visible: "管理快捷操作"
    timeout: 5000

# Tap "新建动作" inside the manage sheet to reach the editor.
- tapOn:
    id: "hub_manage_new_action"
- extendedWaitUntil:
    visible:
      id: "hub_action_editor_name"
    timeout: 5000

- tapOn:
    id: "hub_action_editor_name"
- inputText: "管理键"
- tapOn:
    id: "hub_action_editor_capability_0"
- extendedWaitUntil:
    visible: "关闭空调"
    timeout: 5000
- tapOn:
    text: "关闭空调"
- tapOn:
    id: "hub_action_editor_save"

# Editor dismisses, manage sheet still up. Dismiss the manage sheet.
- extendedWaitUntil:
    visible:
      id: "hub_manage_done_button"
    timeout: 5000
- tapOn:
    id: "hub_manage_done_button"

# Back on Hub — new action lands in slot 4 (first empty slot).
- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_4"
    direction: DOWN
    timeout: 5000
- assertVisible: "管理键"

- takeScreenshot: tmp/screenshots/hub_quick_actions_manage_save

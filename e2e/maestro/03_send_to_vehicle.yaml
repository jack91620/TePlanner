# Tap "发送到车辆" and verify the request reaches the backend.
#
# Run after 02_search_preview.yaml so the route-preview sheet is open.
# In a chained run (`maestro test e2e/maestro/`), Maestro executes
# files alphabetically, so 03 picks up where 02 left.

appId: com.teplanner.ios
---
- assertVisible:
    id: "send_to_vehicle_button"

- tapOn:
    id: "send_to_vehicle_button"

# The button label transitions: 发送到车辆 → ⏳ → either 已发送 (200)
# or 重新发送 + 服务器错误 (4xx/5xx). Either way the network call
# left, which is what we want to verify here. The vehicle-online
# preconditions are out of scope for the iOS test.
- extendedWaitUntil:
    visible:
      text: "已发送|重新发送"
      enabled: false  # button can be disabled in either terminal state
    timeout: 30000

- takeScreenshot: tmp/screenshots/maestro_after_send

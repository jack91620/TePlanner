# Persistence: create a custom action, kill + relaunch the app,
# the action should still be in slot 4. Pins the wire format end
# to end (iOS encodes → backend stores → iOS reloads + decodes).
appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

# Create the action.
- scrollUntilVisible:
    element:
      id: "hub_quick_action_empty_4"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "hub_quick_action_empty_4"
- extendedWaitUntil:
    visible:
      id: "hub_action_picker_create"
    timeout: 5000
- tapOn:
    id: "hub_action_picker_create"
- extendedWaitUntil:
    visible:
      id: "hub_action_editor_name"
    timeout: 5000
- tapOn:
    id: "hub_action_editor_name"
- inputText: "持久化"
- tapOn:
    id: "hub_action_editor_capability_0"
- extendedWaitUntil:
    visible: "关闭空调"
    timeout: 5000
- tapOn:
    text: "关闭空调"
- tapOn:
    id: "hub_action_editor_save"
- extendedWaitUntil:
    visible: "持久化"
    timeout: 5000

# Kill the app + relaunch.
- killApp: com.teplanner.ios
- launchApp:
    appId: com.teplanner.ios
    clearKeychain: false
    stopApp: false

# Helper logs back in if we somehow got bumped to splash; else
# straight to Hub.
- runFlow: _helpers/ensure_logged_in.yaml

- scrollUntilVisible:
    element:
      id: "hub_quick_action_slot_4"
    direction: DOWN
    timeout: 8000

# The action survived relaunch.
- assertVisible: "持久化"
- assertVisible:
    id: "hub_quick_action_slot_4"

- takeScreenshot: tmp/screenshots/hub_quick_actions_after_relaunch

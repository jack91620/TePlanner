# Android wrapper for the shared Hub smoke flow.
# Run: make e2e-android FLOW=cross_platform/hub_smoke_android.yaml
#
# Precondition: a logged-in account exists on the emulator.

appId: com.teplanner.android
---
- launchApp:
    appId: com.teplanner.android
- runFlow: ../_shared/hub_smoke.yaml
- takeScreenshot: tmp/screenshots/maestro_xplatform_android_hub

# 电池管理入口 —— Hub → 电池管理页 → 校验充电限额 + 限额预设 +
# 统计区可见。从前叫"充电统计"，重构后扩展为电池管理域。

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- runFlow:
    when:
      visible: "稍后再说"
    commands:
      - tapOn: "稍后再说"

- tapOn:
    id: "hub_entry_battery"

- extendedWaitUntil:
    visible:
      id: "battery_view"
    timeout: 5000
- assertVisible: "电池管理"
- assertVisible: "限额预设"
- takeScreenshot: tmp/screenshots/maestro_battery

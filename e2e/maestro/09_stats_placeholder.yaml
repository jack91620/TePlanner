# Phase 5.4 充电统计入口 —— Hub → 充电统计页。
# 没有充电记录时显示 empty state；有记录则显示本月概览 + 历史列表。
# 测试只验证页面进入 + 标题渲染，不依赖具体记录数（取决于车辆状态）。

appId: com.teplanner.ios
---
- runFlow: _helpers/ensure_logged_in.yaml

- tapOn:
    id: "hub_entry_stats"

- extendedWaitUntil:
    visible:
      id: "charging_stats_view"
    timeout: 5000
- assertVisible: "充电统计"
- takeScreenshot: tmp/screenshots/maestro_stats_placeholder
